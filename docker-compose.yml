version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud_pos
    ports:
      - "5432:5432"
    volumes:
      - pos_db_data:/var/lib/postgresql/data

volumes:
  pos_db_data:
